services:
  ollama:
    image: ollama/ollama:latest
    container_name: nano-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts:/scripts
    entrypoint: ["/bin/bash", "/scripts/ollama-entrypoint.sh"]
    environment:
      - OLLAMA_MODEL=qwen3.5:4b
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 30

  agent:
    build: .
    container_name: nano-agent
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - API_URL=http://ollama:11434/api/chat
      - API_MODEL=qwen3.5:4b
      - API_CTX=32768
    volumes:
      - ./app/workspace:/app/app/workspace
      - ./app/logs:/app/app/logs
    restart: unless-stopped

volumes:
  ollama_data:
