services:
  ollama:
    image: ollama/ollama:latest
    container_name: nano-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts:/scripts
    entrypoint: ["/bin/bash", "/scripts/ollama-entrypoint.sh"]
    environment:
      - OLLAMA_MODEL=huihui_ai/qwen3.5-abliterated:4b
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    profiles: ["linux"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen3.5-abliterated"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 30s

  agent:
    build: .
    container_name: nano-agent
    ports:
      - "8000:8000"
    environment:
      - API_URL=http://host.docker.internal:11434/api/chat
      - API_MODEL=huihui_ai/qwen3.5-abliterated:4b
      - API_CTX=8192
    volumes:
      - ./app/workspace:/app/app/workspace
      - ./app/logs:/app/app/logs
    profiles: ["mac"]
    restart: unless-stopped

  agent-linux:
    build: .
    container_name: nano-agent
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - API_URL=http://ollama:11434/api/chat
      - API_MODEL=huihui_ai/qwen3.5-abliterated:4b
      - API_CTX=8192
    volumes:
      - ./app/workspace:/app/app/workspace
      - ./app/logs:/app/app/logs
    profiles: ["linux"]
    restart: unless-stopped

volumes:
  ollama_data:
