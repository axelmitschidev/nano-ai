name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check app/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -c "from app.tools import register_all; register_all(); print('tools OK')"
      - run: python -c "from app.agent.prompt import load_system_prompt; print(load_system_prompt()[:50])"
      - run: python -c "from app.agent.context import trim; print('context OK')"
      - run: python -c "from app.llm.ollama import OllamaClient; print('ollama OK')"
      - run: python -c "from app.session import SessionStore; print('session OK')"
      - run: python -c "from app.server import app; print('server OK')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nano-ai .
